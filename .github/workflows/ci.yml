name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: Testes e Build
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Verificar formatação
        shell: pwsh
        run: |
          $files = gofmt -l ./cmd ./internal
          if ($files) {
            Write-Host "Arquivos que precisam de gofmt:"
            Write-Host $files
            exit 1
          }

      - name: Baixar dependências
        run: go mod download

      - name: Executar testes
        run: go test ./...

      - name: Compilar Windows AMD64
        run: go build -trimpath -o protheus-mcp-windows-amd64.exe ./cmd/protheus-mcp
