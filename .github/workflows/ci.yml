name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: Testes e Build
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25.x'
          cache: true

      - name: Normalizar formatação Go
        shell: pwsh
        run: gofmt -w ./cmd ./internal

      - name: Sincronizar módulos
        run: go mod tidy

      - name: Executar testes
        run: go test ./...

      - name: Compilar Windows AMD64
        run: go build -trimpath -o protheus-mcp-windows-amd64.exe ./cmd/protheus-mcp
